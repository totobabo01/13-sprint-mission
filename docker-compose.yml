services:
  postgres:
    image: postgres:17
    container_name: discodeit-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  app:
    container_name: discodeit-app

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_PORT: 80

      DISCODEIT_STORAGE_TYPE: local
      DISCODEIT_STORAGE_LOCAL_ROOT_PATH: ${BINARY_CONTENT_PATH}

      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"

    ports:
      - "${APP_PORT}:80"

    volumes:
      - binary-content-data:${BINARY_CONTENT_PATH}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres-data:
  binary-content-data: