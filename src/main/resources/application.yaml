spring:
  application:
    name: discodeit

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

logging:
  level:
    root: info

discodeit:
  repository:
    type: jpa

  storage:
    type: local
    local:
      root-path: data/binaryContents

  file-directory: data